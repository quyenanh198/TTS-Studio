[project]
name = "tts-studio"
version = "1.0.0"
description = "Desktop TTS / transcript / voice-clone studio (Vietnamese-first)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pywebview>=5.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "edge-tts>=7.0",
    "httpx>=0.27",
    "aiofiles>=24.1",
    "python-multipart>=0.0.9",
    "pysrt>=1.1",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "chardet>=5.2",
]

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.1",
]
clone = [
    "torch>=2.4",
    "torchaudio>=2.4",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
